<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7a351f">
<title>Crunch Tuckers | Business Management System</title>
<style>
:root{--brown:#7a351f;--brown2:#9b4c2b;--cream:#fffaf4;--peach:#f8e5d8;--ink:#30251f;--muted:#766a62;--line:#eadbd1;--green:#28784c;--red:#b63b32;--shadow:0 8px 28px #4b26100d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fffdfb;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:linear-gradient(110deg,#6d2c19,#a9552e);color:#fff;padding:15px clamp(16px,4vw,42px);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:13px;padding:3px}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:#ffe4d1;font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:650}.btn.primary{background:var(--brown);border-color:var(--brown);color:#fff}.top .btn{border-color:#ffffff70}.top .btn.primary{background:#fff;color:var(--brown)}.btn:disabled{opacity:.45;cursor:not-allowed}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 78px)}aside{background:#fff8f2;border-right:1px solid var(--line);padding:20px 14px}.nav-label{font-size:11px;font-weight:800;color:#9b8172;letter-spacing:1.1px;padding:8px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:10px;color:#60483c;font-weight:650;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{background:var(--peach);color:var(--brown)}main{padding:clamp(18px,3vw,34px);min-width:0;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}.page-head h2{font-size:27px;margin:0 0 6px}.sub{color:var(--muted);margin:0;font-size:14px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.metric,.panel,.product-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:17px;box-shadow:var(--shadow)}.metric .label{font-size:13px;color:var(--muted)}.metric .value{font-size:25px;font-weight:800;margin-top:9px}.metric .hint{font-size:12px;color:var(--muted);margin-top:4px}.section-title{font-size:17px;margin:0 0 14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{margin-bottom:16px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #f0e6df;white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#fffaf6}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:750;background:#f2eee9;color:#66564b}.badge.good{background:#e5f5ea;color:#22643e}.badge.warn{background:#fff0d9;color:#8c5915}.badge.bad{background:#fde8e5;color:#9b2e27}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:750;color:#6d5548}.field input,.field select,.field textarea{width:100%;border:1px solid #e5d5ca;border-radius:9px;padding:10px;background:#fffdfb;color:var(--ink);min-width:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .field{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.empty{padding:25px;text-align:center;color:var(--muted)}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.product-card{padding:0;overflow:hidden}.product-card img{width:100%;height:165px;object-fit:cover;background:#fff0e5}.product-body{padding:15px}.product-body h3{margin:0 0 5px}.price{font-size:22px;font-weight:850;color:var(--brown)}.stockline{font-size:12px;color:var(--muted);margin:7px 0 12px}.product-body .btn{width:100%}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff}.notice{padding:12px 14px;background:#fff3e7;border:1px solid #f1d4bc;border-radius:10px;color:#71442b;font-size:13px;margin-bottom:16px}.barrow{display:grid;grid-template-columns:110px 1fr 55px;gap:10px;align-items:center;margin:12px 0;font-size:13px}.bar{height:10px;border-radius:99px;background:#f2e8e1;overflow:hidden}.bar span{display:block;height:100%;background:var(--brown2);border-radius:99px}.login-cover{position:fixed;inset:0;background:#2c1c16a8;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.login{width:min(430px,100%);background:#fffaf6;border-radius:20px;padding:26px;box-shadow:0 20px 70px #0003}.login img{width:70px;height:70px;object-fit:contain}.login h2{margin:8px 0}.small{font-size:12px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:#30251f;color:#fff;padding:12px 16px;border-radius:11px;box-shadow:0 8px 30px #0002;display:none;z-index:20;max-width:90vw}.footer-note{font-size:12px;color:var(--muted);margin:22px 0}.mobile-menu{display:none}
@media(max-width:950px){.layout{grid-template-columns:1fr}aside{padding:10px;border-right:0;border-bottom:1px solid var(--line)}.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.nav-label{display:none}.nav button{font-size:12px;padding:9px 7px;justify-content:center}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.products{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.top{padding:12px}.brand h1{font-size:17px}.brand img{width:42px;height:42px}.cards{gap:9px}.metric{padding:13px}.metric .value{font-size:21px}.two,.form-grid{grid-template-columns:1fr}.products{grid-template-columns:1fr}.product-card img{height:190px}main{padding:16px}.page-head h2{font-size:23px}.nav{grid-template-columns:repeat(3,minmax(0,1fr))}.nav button{font-size:11px}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><img src="img/logo.png" alt="Crunch Tuckers logo" onerror="this.style.display='none'"><div><h1>Crunch Tuckers</h1><p>Business Management System</p></div></div>
 <div class="top-actions"><button class="btn" id="customerBtn">Customer Store</button><button class="btn primary" id="loginBtn">Staff Login</button></div>
</header>
<div class="layout">
<aside><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav"></nav></aside>
<main id="app"></main>
</div>
<div class="login-cover" id="loginCover"><div class="login">
 <img src="img/logo.png" alt=""><h2>Staff Login</h2><p class="sub">Sign in to manage Crunch Tuckers.</p>
 <form id="loginForm"><div class="field"><label>Username</label><input id="username" autocomplete="username" required value="admin"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Enter password"></div><button class="btn primary" style="width:100%">Sign in</button></form>
 <p class="small">Demo login: admin / crunch123. Change this before real business use.</p><button class="btn" id="closeLogin">Cancel</button>
</div></div>
<div class="toast" id="toast"></div>
<script>
const MODULES=[
 ["dashboard","▦","Dashboard"],["sales","🛒","Sales"],["inventory","📦","Inventory"],["products","🍴","Products"],["expenses","🧾","Expenses"],["cashflow","↔","Cash Flow"],["profitloss","▥","Profit & Loss"],["reports","▤","Reports"],["users","♙","Users"]
];
const money=n=>"₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toLocaleDateString("en-CA");
const fresh=()=>({day:today(),products:[
{id:"original",name:"Original",price:25,stock:30,daily:30,image:"img/original.png",available:true},
{id:"cheese",name:"Extra Cheese",price:25,stock:30,daily:30,image:"img/extra-cheese.png",available:true},
{id:"spicy",name:"Spicy",price:25,stock:30,daily:30,image:"img/spicy.png",available:true}
],sales:[],expenses:[],cashAdjustments:[],inventoryLog:[],users:[{id:1,name:"Administrator",username:"admin",role:"Manager",password:"crunch123",active:true}],nextSale:1,nextExpense:1,nextUser:2,startingCash:0});
function load(){try{let d=JSON.parse(localStorage.getItem("crunchTuckersData"));if(!d)return fresh();if(d.day!==today()){d.day=today();d.products.forEach(p=>{p.stock=p.daily??30;p.available=true});d.inventoryLog.push({date:today(),type:"Daily reset",item:"All products",qty:90,note:"Daily stock reset to 30 pieces per variant"});save(d)}return d}catch{return fresh()}}
let data=load(),page="dashboard",logged=false,cart={};
function save(d=data){localStorage.setItem("crunchTuckersData",JSON.stringify(d))}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2600)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function product(id){return data.products.find(p=>p.id===id)}
function sum(a,fn){return a.reduce((s,x)=>s+fn(x),0)}
function soldPieces(p){return sum(data.sales.filter(s=>s.date===today()),s=>sum(s.items.filter(i=>i.id===p.id),i=>i.qty*3))}
function todaySales(){return data.sales.filter(s=>s.date===today())}
function revenue(sales=data.sales){return sum(sales,s=>s.total)}
function costOfSales(sales=data.sales){return sum(sales,s=>sum(s.items,i=>i.qty*3*(i.unitCost||0)))}
function operatingExpenses(expenses=data.expenses){return sum(expenses,e=>e.amount)}
function inflows(){return revenue()+sum(data.cashAdjustments.filter(x=>x.type==="Inflow"),x=>x.amount)}
function outflows(){return operatingExpenses()+sum(data.cashAdjustments.filter(x=>x.type==="Outflow"),x=>x.amount)}
function cashBalance(){return Number(data.startingCash||0)+inflows()-outflows()}
function profit(){return revenue()-costOfSales()-operatingExpenses()}
function tag(text,cls=""){return `<span class="badge ${cls}">${text}</span>`}
function metric(label,value,hint=""){return `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}
function head(title,sub,button=""){return `<div class="page-head"><div><h2>${title}</h2><p class="sub">${sub}</p></div>${button}</div>`}
function btn(label,action,primary=false){return `<button class="btn ${primary?"primary":""}" data-action="${action}">${label}</button>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records yet.</td></tr>`}</tbody></table></div>`}
function nav(){document.getElementById("nav").innerHTML=MODULES.map(([id,icon,name])=>`<button class="${page===id?"active":""}" data-page="${id}" title="${name}"><span>${icon}</span>${name}</button>`).join("")}
function dashboard(){let ts=todaySales();return head("Dashboard","Today's business overview",btn("Record a sale","new-sale",true))+`<div class="cards">${metric("Today's Sales",money(revenue(ts)),ts.length+" transactions")}${metric("Available Stock",sum(data.products,p=>p.stock)+" pcs","Across 3 product variants")}${metric("Current Cash Balance",money(cashBalance()),"Based on recorded inflows and outflows")}${metric("Net Profit / (Loss)",money(profit()),"All recorded transactions")}</div><div class="two"><section class="panel"><h3 class="section-title">Daily Product Stock</h3>${data.products.map(p=>`<div class="barrow"><span>${esc(p.name)}</span><div class="bar"><span style="width:${Math.max(0,Math.min(100,p.stock/p.daily*100))}%"></span></div><strong>${p.stock}/${p.daily}</strong></div>`).join("")}<p class="small">Each product starts with 30 pieces every business day. One serving contains 3 pieces.</p></section><section class="panel"><h3 class="section-title">Quick Actions</h3><div class="actions">${btn("New Sale","new-sale",true)}${btn("Add Expense","new-expense")}${btn("Stock Adjustment","new-stock")}${btn("View Reports","page-reports")}</div><h3 class="section-title" style="margin-top:22px">Business Summary</h3><p class="sub">Revenue: <strong>${money(revenue())}</strong></p><p class="sub">Cost of goods sold: <strong>${money(costOfSales())}</strong></p><p class="sub">Operating expenses: <strong>${money(operatingExpenses())}</strong></p></section></div><section class="panel"><h3 class="section-title">Recent Sales</h3>${table(["Date / Time","Receipt","Items","Total","Payment"],data.sales.slice(-5).reverse().map(s=>`<tr><td>${esc(s.date)} ${esc(s.time)}</td><td>#${s.id}</td><td>${s.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(", ")}</td><td>${money(s.total)}</td><td>${esc(s.payment)}</td></tr>`).join(""))}</section>`}
function store(){return head("Customer Store","Choose your Crunch Tuckers favorites. Each serving contains 3 pieces.")+`<div class="notice">Daily availability: 30 pieces per variant. Spicy is available while stock lasts.</div><div class="products">${data.products.map(p=>`<article class="product-card"><img src="${p.image}" alt="${esc(p.name)}" onerror="this.style.objectFit='contain'"><div class="product-body"><h3>${esc(p.name)}</h3><div class="price">${money(p.price)} <span class="small">/ 3-piece serving</span></div><p class="stockline">${p.stock>0&&p.available?tag("Available","good"):tag("Sold out","bad")} · ${p.stock} pieces left</p><div class="field"><label>Servings (3 pieces each)</label><input type="number" min="1" max="${Math.floor(p.stock/3)}" value="${cart[p.id]||1}" data-cart="${p.id}" ${p.stock<3||!p.available?"disabled":""}></div><button class="btn primary" data-action="add-cart" data-id="${p.id}" ${p.stock<3||!p.available?"disabled":""}>Add to order</button></div></article>`).join("")}</div><section class="panel" style="margin-top:18px"><h3 class="section-title">Customer Order Cart</h3>${cartItems().length?table(["Product","Servings","Amount","Action"],cartItems().map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price*i.qty)}</td><td><button class="btn" data-action="remove-cart" data-id="${i.id}">Remove</button></td></tr>`).join(""))+`<div class="actions"><strong style="padding:10px 0">Total: ${money(sum(cartItems(),i=>i.qty*i.price))}</strong><button class="btn primary" data-action="checkout">Place demo order</button></div><p class="small">Demo checkout records a sale locally. It does not process online payments or send an order to staff.</p>`:`<div class="empty">Your cart is empty. Add a product to begin.</div>`}</section>`}
function cartItems(){return Object.entries(cart).map(([id,qty])=>{let p=product(id);return p&&qty>0?{id,name:p.name,price:p.price,qty}:null}).filter(Boolean)}
function salesPage(){return head("Sales","Record transactions, accept payment details, and review sales history.",btn("New Sale","new-sale",true))+`<div class="cards">${metric("Today's Sales",money(revenue(todaySales())),todaySales().length+" transactions")}${metric("All-Time Sales",money(revenue()),data.sales.length+" transactions")}${metric("Cost of Goods Sold",money(costOfSales()),"Based on recorded unit costs")}${metric("Average Sale",money(data.sales.length?revenue()/data.sales.length:0),"Per transaction")}</div><section class="panel"><h3 class="section-title">Sales History</h3>${table(["Receipt","Date","Items","Total","Paid","Change","Payment"],data.sales.slice().reverse().map(s=>`<tr><td>#${s.id}</td><td>${s.date} ${s.time}</td><td>${s.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(", ")}</td><td>${money(s.total)}</td><td>${money(s.paid)}</td><td>${money(s.change)}</td><td>${esc(s.payment)}</td></tr>`).join(""))}</section>`}
function inventoryPage(){return head("Inventory","Track stock, daily quantities, stock movements, and adjustments.",btn("Adjust Stock","new-stock",true))+`<div class="cards">${metric("Total Pieces Available",sum(data.products,p=>p.stock)+" pcs","Maximum 90 pieces per day")}${metric("Daily Starting Stock","90 pcs","30 pieces per variant")}${metric("Low Stock",data.products.filter(p=>p.stock<=6).length,"At or below 6 pieces")}${metric("Stock Value",money(sum(data.products,p=>p.stock*(p.unitCost||0))),"Using estimated unit cost")}</div><section class="panel"><h3 class="section-title">Current Inventory</h3>${table(["Product","Daily Stock","Sold Today","Available","Status","Action"],data.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.daily} pcs</td><td>${soldPieces(p)} pcs</td><td><strong>${p.stock} pcs</strong></td><td>${p.stock===0?tag("Sold out","bad"):p.stock<=6?tag("Low stock","warn"):tag("In stock","good")}</td><td><button class="btn" data-action="stock-one" data-id="${p.id}">Adjust</button></td></tr>`).join(""))}</section><section class="panel"><h3 class="section-title">Stock Movement Log</h3>${table(["Date","Type","Item","Quantity","Notes"],data.inventoryLog.slice().reverse().map(l=>`<tr><td>${esc(l.date)}</td><td>${esc(l.type)}</td><td>${esc(l.item)}</td><td>${l.qty}</td><td>${esc(l.note||"")}</td></tr>`).join(""))}</section>`}
function productsPage(){return head("Products","Manage product details, prices, daily stock, and availability.",btn("Add Product","new-product",true))+`<div class="products">${data.products.map(p=>`<article class="product-card"><img src="${p.image}" alt="${esc(p.name)}"><div class="product-body"><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div><p class="stockline">Daily limit: ${p.daily} pieces · Remaining: ${p.stock}</p><p>${p.available?tag("Available","good"):tag("Unavailable","bad")}</p><div class="actions"><button class="btn" data-action="edit-product" data-id="${p.id}">Edit</button><button class="btn" data-action="toggle-product" data-id="${p.id}">${p.available?"Mark unavailable":"Make available"}</button></div></div></article>`).join("")}</div>`}
function expensesPage(){return head("Expenses","Record ingredient purchases, packaging, transportation, utilities, and other costs.",btn("Record Expense","new-expense",true))+`<div class="cards">${metric("Total Expenses",money(operatingExpenses()),data.expenses.length+" records")}${metric("This Month",money(sum(data.expenses.filter(e=>e.date.slice(0,7)===today().slice(0,7)),e=>e.amount)),"Recorded expense total")}</div><section class="panel"><h3 class="section-title">Expense History</h3>${table(["Date","Category","Description","Amount","Paid By"],data.expenses.slice().reverse().map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td><td>${esc(e.paidBy)}</td></tr>`).join(""))}</section>`}
function cashPage(){return head("Cash Flow","Review money received, expenses paid, adjustments, and current cash balance.",btn("Record Cash Movement","new-cash",true))+`<div class="cards">${metric("Starting Cash",money(data.startingCash),"Set in cash-flow settings")}${metric("Total Inflows",money(inflows()),"Sales plus additional inflows")}${metric("Total Outflows",money(outflows()),"Expenses plus other outflows")}${metric("Current Cash Balance",money(cashBalance()),"Starting cash + inflows − outflows")}</div><section class="panel"><h3 class="section-title">Cash Flow Settings</h3><form id="startingCashForm" class="form-grid"><div class="field"><label>Starting cash balance (₱)</label><input name="startingCash" type="number" min="0" step=".01" value="${data.startingCash}"></div><div class="field" style="justify-content:end"><button class="btn primary">Save starting balance</button></div></form></section><section class="panel"><h3 class="section-title">Additional Cash Movements</h3>${table(["Date","Type","Description","Amount"],data.cashAdjustments.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.description)}</td><td>${money(x.amount)}</td></tr>`).join(""))}</section>`}
function plPage(){let rev=revenue(),cogs=costOfSales(),gross=rev-cogs,opex=operatingExpenses();return head("Profit & Loss","A summary of revenue, cost of goods sold, expenses, and net profit or loss.")+`<div class="cards">${metric("Revenue",money(rev),"Recorded sales")}${metric("Cost of Goods Sold",money(cogs),"Recorded product unit costs")}${metric("Gross Profit / (Loss)",money(gross),"Revenue minus COGS")}${metric("Net Profit / (Loss)",money(gross-opex),"Gross profit minus expenses")}</div><section class="panel"><h3 class="section-title">Profit & Loss Statement</h3>${table(["Account","Amount"],`<tr><td>Sales Revenue</td><td>${money(rev)}</td></tr><tr><td>Less: Cost of Goods Sold</td><td>(${money(cogs)})</td></tr><tr><td><strong>Gross Profit</strong></td><td><strong>${money(gross)}</strong></td></tr><tr><td>Operating Expenses</td><td>(${money(opex)})</td></tr><tr><td><strong>Net Profit / (Loss)</strong></td><td><strong>${money(gross-opex)}</strong></td></tr>`)}</section><p class="small">Accuracy note: product unit costs are estimates until you enter actual recipe costs. Expenses and COGS should be reviewed to avoid double-counting ingredient purchases.</p>`}
function reportsPage(){let byProduct=data.products.map(p=>({p,qty:sum(data.sales,s=>sum(s.items.filter(i=>i.id===p.id),i=>i.qty))}));return head("Reports","Review and export business records for analysis.",`<button class="btn primary" data-action="export">Export CSV</button>`)+`<div class="cards">${metric("Sales Transactions",data.sales.length,"All recorded sales")}${metric("Expense Records",data.expenses.length,"All recorded expenses")}${metric("Units Sold",sum(data.sales,s=>sum(s.items,i=>i.qty*3))+" pcs","Across all variants")}${metric("Net Profit / (Loss)",money(profit()),"Based on saved records")}</div><div class="two"><section class="panel"><h3 class="section-title">Best-selling Products</h3>${byProduct.sort((a,b)=>b.qty-a.qty).map(x=>`<div class="barrow"><span>${esc(x.p.name)}</span><div class="bar"><span style="width:${Math.min(100,x.qty/Math.max(1,...byProduct.map(y=>y.qty))*100)}%"></span></div><strong>${x.qty}</strong></div>`).join("")}</section><section class="panel"><h3 class="section-title">Report Contents</h3><p class="sub">The CSV export includes separate rows for sales, expenses, inventory, cash flow, and profit/loss summary. Keep a backup of exported records.</p><div class="actions">${btn("Export CSV","export",true)}${btn("Print Report","print")}${btn("Backup Data","backup")}${btn("Restore Backup","restore")}</div></section></div><section class="panel"><h3 class="section-title">Inventory Report</h3>${table(["Product","Daily Stock","Sold Today","Remaining","Availability"],data.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.daily}</td><td>${soldPieces(p)}</td><td>${p.stock}</td><td>${p.available&&p.stock>0?"Available":"Unavailable"}</td></tr>`).join(""))}</section>`}
function usersPage(){return head("Users","Manage staff accounts and access roles.",btn("Add User","new-user",true))+`<div class="notice">This demo stores account data in this browser only. It is not secure for real multi-user deployment. Use a server-side authentication system before handling real business data.</div><section class="panel"><h3 class="section-title">User Accounts</h3>${table(["Name","Username","Role","Status","Action"],data.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${u.active?tag("Active","good"):tag("Inactive","bad")}</td><td><button class="btn" data-action="toggle-user" data-id="${u.id}">${u.active?"Deactivate":"Activate"}</button></td></tr>`).join(""))}</section>`}
function render(){nav();let pages={dashboard,sales:salesPage,inventory:inventoryPage,products:productsPage,expenses:expensesPage,cashflow:cashPage,profitloss:plPage,reports:reportsPage,users:usersPage,store};document.getElementById("app").innerHTML=(page==="store"?store():(logged?pages[page]():loginPrompt()));}
function loginPrompt(){return head("Staff Access","Log in to access business management modules.")+`<section class="panel"><h3 class="section-title">Sign in to continue</h3><p class="sub">Sales, inventory, products, expenses, cash flow, profit & loss, reports, and users are available after staff login.</p><div class="actions">${btn("Staff Login","login",true)}${btn("Open Customer Store","customer")}</div></section>`}
function modalForm(title,fields,submitLabel,action){let html=`<div class="login-cover" id="modalCover" style="display:flex"><div class="login" style="max-height:90vh;overflow:auto;width:min(540px,100%)"><h2>${title}</h2><form id="modalForm"><div class="form-grid">${fields.map(f=>`<div class="field"><label>${f.label}</label>${f.type==="select"?`<select name="${f.name}" ${f.required?"required":""}>${f.options.map(o=>`<option ${o===f.value?"selected":""}>${o}</option>`).join("")}</select>`:`<input name="${f.name}" type="${f.type||"text"}" value="${esc(f.value??"")}" ${f.min!==undefined?`min="${f.min}"`:""} ${f.step?`step="${f.step}"`:""} ${f.required?"required":""} ${f.readonly?"readonly":""} placeholder="${f.placeholder||""}">`}</div>`).join("")}</div><div class="actions"><button class="btn primary">${submitLabel}</button><button type="button" class="btn" data-action="close-modal">Cancel</button></div></form></div></div>`;document.body.insertAdjacentHTML("beforeend",html);document.getElementById("modalForm").onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());action(v);document.getElementById("modalCover")?.remove();save();render()}}
function newSale(prefill){let fields=[{name:"product",label:"Product",type:"select",options:data.products.filter(p=>p.available&&p.stock>=3).map(p=>p.name),required:true},{name:"servings",label:"Servings (3 pieces each)",type:"number",value:1,min:1,required:true},{name:"unitPrice",label:"Price per serving (₱)",type:"number",value:25,min:0,step:".01",required:true},{name:"unitCost",label:"Estimated cost per serving (₱)",type:"number",value:0,min:0,step:".01",required:true},{name:"paid",label:"Amount paid (₱)",type:"number",value:25,min:0,step:".01",required:true},{name:"payment",label:"Payment method",type:"select",options:["Cash","GCash","Other"],required:true}];modalForm("Record Sale",fields,"Save Transaction",v=>{let p=data.products.find(x=>x.name===v.product),qty=Number(v.servings),total=qty*Number(v.unitPrice),paid=Number(v.paid);if(!p||qty<1||qty*3>p.stock){toast("Not enough stock for this sale.");return}if(paid<total){toast("Amount paid must cover the sale total.");return}p.stock-=qty*3;let sale={id:data.nextSale++,date:today(),time:new Date().toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit"}),items:[{id:p.id,name:p.name,qty,unitCost:Number(v.unitCost)/3}],total,paid,change:paid-total,payment:v.payment};data.sales.push(sale);data.inventoryLog.push({date:today(),type:"Stock-out",item:p.name,qty:qty*3,note:`Sale #${sale.id}`});toast("Sale saved successfully.")})}
function newExpense(){modalForm("Record Expense",[{name:"date",label:"Date",type:"date",value:today(),required:true},{name:"category",label:"Category",type:"select",options:["Ingredients","Packaging","Transportation","Utilities","Miscellaneous"],required:true},{name:"description",label:"Description",required:true},{name:"amount",label:"Amount (₱)",type:"number",min:.01,step:".01",required:true},{name:"paidBy",label:"Paid by",type:"select",options:["Cash","GCash","Other"],required:true}], "Save Expense",v=>{data.expenses.push({id:data.nextExpense++,...v,amount:Number(v.amount)});toast("Expense recorded.")})}
function newStock(id){let p=id?product(id):null;modalForm("Stock Adjustment",[{name:"product",label:"Product",type:"select",options:data.products.map(x=>x.name),value:p?.name,required:true},{name:"type",label:"Movement",type:"select",options:["Stock-in","Stock-out","Set quantity","Daily limit"],required:true},{name:"qty",label:"Quantity (pieces)",type:"number",value:1,min:0,required:true},{name:"note",label:"Notes"}],"Save Adjustment",v=>{let q=Number(v.qty),x=data.products.find(p=>p.name===v.product);if(v.type==="Stock-in")x.stock+=q;else if(v.type==="Stock-out")x.stock=Math.max(0,x.stock-q);else if(v.type==="Set quantity")x.stock=q;else{x.daily=q;x.stock=q}x.available=true;data.inventoryLog.push({date:today(),type:v.type,item:x.name,qty:q,note:v.note||""});toast("Inventory updated.")})}
function newProduct(id){let p=id?product(id):null;modalForm(p?"Edit Product":"Add Product",[{name:"name",label:"Product name",value:p?.name||"",required:true},{name:"price",label:"Selling price per serving (₱)",type:"number",value:p?.price??25,min:0,step:".01",required:true},{name:"daily",label:"Daily stock limit (pieces)",type:"number",value:p?.daily??30,min:0,required:true},{name:"unitCost",label:"Estimated cost per piece (₱)",type:"number",value:p?.unitCost??0,min:0,step:".01"},{name:"available",label:"Availability",type:"select",options:["Available","Unavailable"],value:p?.available===false?"Unavailable":"Available",required:true}],"Save Product",v=>{if(p){p.name=v.name;p.price=Number(v.price);p.daily=Number(v.daily);p.stock=Math.min(p.stock,p.daily);p.unitCost=Number(v.unitCost||0);p.available=v.available==="Available"}else{let id=v.name.toLowerCase().replace(/[^a-z0-9]+/g,"-");data.products.push({id,name:v.name,price:Number(v.price),daily:Number(v.daily),stock:Number(v.daily),unitCost:Number(v.unitCost||0),available:v.available==="Available",image:"img/original.png"})}toast("Product saved.")})}
function newCash(){modalForm("Record Cash Movement",[{name:"date",label:"Date",type:"date",value:today(),required:true},{name:"type",label:"Movement type",type:"select",options:["Inflow","Outflow"],required:true},{name:"description",label:"Description",required:true},{name:"amount",label:"Amount (₱)",type:"number",min:.01,step:".01",required:true}],"Save Movement",v=>{data.cashAdjustments.push({...v,amount:Number(v.amount)});toast("Cash movement recorded.")})}
function newUser(){modalForm("Add User",[{name:"name",label:"Full name",required:true},{name:"username",label:"Username",required:true},{name:"password",label:"Temporary password",type:"password",required:true},{name:"role",label:"Role",type:"select",options:["Staff","Manager"],required:true}],"Create User",v=>{if(data.users.some(u=>u.username===v.username)){toast("Username already exists.");return}data.users.push({id:data.nextUser++,...v,active:true});toast("User added.")})}
function exportCSV(){let rows=[["Record Type","Date","Reference","Category / Product","Details","Quantity","Amount","Payment / Status"]];data.sales.forEach(s=>s.items.forEach(i=>rows.push(["Sale",s.date,s.id,i.name,`Sale #${s.id}`,i.qty*3,s.total,s.payment])));data.expenses.forEach(e=>rows.push(["Expense",e.date,e.id,e.category,e.description,"",e.amount,e.paidBy]));data.products.forEach(p=>rows.push(["Inventory",today(),p.id,p.name,"Remaining stock",p.stock,"",p.available?"Available":"Unavailable"]));data.cashAdjustments.forEach(c=>rows.push(["Cash Flow",c.date,"",c.type,c.description,"",c.amount,c.type]));rows.push(["P&L",today(),"","Revenue","All recorded sales","",revenue(),""]);rows.push(["P&L",today(),"","COGS","Estimated cost of goods sold","",costOfSales(),""]);rows.push(["P&L",today(),"","Operating Expenses","Recorded expenses","",operatingExpenses(),""]);rows.push(["P&L",today(),"","Net Profit / (Loss)","Revenue less COGS and expenses","",profit(),""]);let csv=rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));a.download=`crunch-tuckers-report-${today()}.csv`;a.click();URL.revokeObjectURL(a.href);toast("CSV report exported.")}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download=`crunch-tuckers-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
document.addEventListener("click",e=>{let b=e.target.closest("[data-page],[data-action]");if(!b)return;if(b.dataset.page){let next=b.dataset.page;if(next==="store"){page="store"}else if(logged){page=next}else{page=next;document.getElementById("loginCover").style.display="flex";return}render();return}let a=b.dataset.action,id=b.dataset.id;if(a==="login")document.getElementById("loginCover").style.display="flex";if(a==="customer"){page="store";render()}if(a==="new-sale")newSale();if(a==="new-expense")newExpense();if(a==="new-stock")newStock();if(a==="stock-one")newStock(id);if(a==="new-product")newProduct();if(a==="edit-product")newProduct(id);if(a==="toggle-product"){let p=product(id);p.available=!p.available;save();render();toast("Product availability updated.")}if(a==="new-cash")newCash();if(a==="new-user")newUser();if(a==="toggle-user"){let u=data.users.find(x=>x.id==id);if(u.username==="admin"){toast("The main admin account cannot be deactivated.");return}u.active=!u.active;save();render()}if(a==="close-modal")document.getElementById("modalCover")?.remove();if(a==="new-sale"){}if(a==="page-reports"){page="reports";render()}if(a==="add-cart"){let p=product(id),n=Number(cart[id]||1);if(!p||n*3>p.stock){toast("Not enough stock for that order.");return}cart[id]=n;render();toast("Added to cart.")}if(a==="remove-cart"){delete cart[id];render()}if(a==="checkout"){let items=cartItems();if(!items.length)return;let issue=items.find(i=>i.qty*3>product(i.id).stock);if(issue){toast("Stock changed; please update your cart.");return}let total=sum(items,i=>i.price*i.qty),sale={id:data.nextSale++,date:today(),time:new Date().toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit"}),items:items.map(i=>({id:i.id,name:i.name,qty:i.qty,unitCost:(product(i.id).unitCost||0)})),total,paid:total,change:0,payment:"Customer demo order"};items.forEach(i=>{product(i.id).stock-=i.qty*3;data.inventoryLog.push({date:today(),type:"Stock-out",item:i.name,qty:i.qty*3,note:`Sale #${sale.id}`})});data.sales.push(sale);cart={};save();render();toast("Demo order recorded.")}if(a==="export")exportCSV();if(a==="print")window.print();if(a==="backup")backup();if(a==="restore")document.getElementById("restoreFile").click()});
document.getElementById("loginBtn").onclick=()=>document.getElementById("loginCover").style.display="flex";
document.getElementById("customerBtn").onclick=()=>{page="store";render()};
document.getElementById("closeLogin").onclick=()=>document.getElementById("loginCover").style.display="none";
document.getElementById("loginForm").onsubmit=e=>{e.preventDefault();let u=document.getElementById("username").value,p=document.getElementById("password").value,account=data.users.find(x=>x.username===u&&x.password===p&&x.active);if(!account){toast("Incorrect login details or inactive account.");return}logged=true;document.getElementById("loginCover").style.display="none";page="dashboard";render();toast("Welcome, "+account.name+"!")};
document.addEventListener("change",e=>{if(e.target.dataset.cart){cart[e.target.dataset.cart]=Math.max(1,Number(e.target.value)||1);render()}});
document.addEventListener("submit",e=>{if(e.target.id==="startingCashForm"){e.preventDefault();data.startingCash=Number(new FormData(e.target).get("startingCash")||0);save();render();toast("Starting cash saved.")}});
let restore=document.createElement("input");restore.type="file";restore.id="restoreFile";restore.accept=".json,application/json";restore.hidden=true;document.body.appendChild(restore);restore.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.sales||!d.expenses)throw Error();data=d;save();render();toast("Backup restored.")}catch{toast("Invalid backup file.")}};r.readAsText(f)};
save();render();
</script>
</body></html>
